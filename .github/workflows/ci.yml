name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  models:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check official current models and effort contracts
        id: models
        run: |
          npm run models:update
          git diff --binary -- src/claude-models.ts src/provider-prices-data.ts > "$RUNNER_TEMP/model-update.patch"
          git diff --exit-code -- src/claude-models.ts src/provider-prices-data.ts
      - name: Save the proposed metadata update
        if: failure() && steps.models.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: model-update-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/model-update.patch
          if-no-files-found: ignore
          retention-days: 7
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # release.mjs check reads the release tags to keep a released version frozen; a shallow clone has none.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Validate with the current native Claude host
        run: npm exec --yes --package=@anthropic-ai/claude-code@latest -- claude plugin validate . --strict
      - name: Verify current Haiku model and effort at the native request boundary
        # Disposable homes and local scripted APIs only; no model keys or paid inference.
        run: npm exec --yes --package=@anthropic-ai/claude-code@latest -- env JEV_CLAUDE_E2E=1 node node_modules/vitest/vitest.mjs run tests/claude/agent-model-runtime.test.ts -t claude-haiku-5-5 --maxWorkers=2
      - name: Verify native Claude background completion and cancellation
        run: npm exec --yes --package=@anthropic-ai/claude-code@latest -- env JEV_CLAUDE_E2E=1 node node_modules/vitest/vitest.mjs run tests/claude/background-runtime.test.ts --maxWorkers=1
      - name: Prepare the native Codex Linux sandbox
        # Keep read-only permission tests intact; Ubuntu 24.04 needs the distribution bwrap profile.
        # https://developers.openai.com/codex/concepts/sandboxing#prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap apparmor-profiles apparmor-utils
          if [ -f /usr/share/apparmor/extra-profiles/bwrap-userns-restrict ]; then
            sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          fi
      - name: Verify encrypted worker continuations with the current native Codex host
        run: npm exec --yes --package=@openai/codex@latest -- env JEV_CODEX_E2E=1 node node_modules/vitest/vitest.mjs run tests/codex/connection-runtime.test.ts --maxWorkers=1
      # doctor performs no inference and needs no key or login; it only reports missing ones.
      - run: node dist/cli.js doctor
      # main serves the marketplace: its jev-gate entry must pin the archive this tree builds.
      - if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
        run: node scripts/release.mjs check
