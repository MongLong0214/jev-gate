name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The job may write releases. Install, tests and build run third-party code, so the gh steps below receive the
          # write token rather than git's config holding it for every step; the repository is public, so fetches need none.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The marketplace is served from main, so a tag on a commit main does not have is rejected rather than released.
      - run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Rebuilds every archive the marketplace pins (from v0.6.0 the one jev-gate plugin) and refuses unless each matches
      # its SHA-256, the tag names the version, and main serves these same entries.
      - run: node scripts/release.mjs check --tag "$GITHUB_REF_NAME" --against origin/main --out dist-release
      - run: node scripts/pack.mjs dist-release --profile codex
      - run: |
          printf '\nCodex archive SHA-256:\n\n' >> dist-release/NOTES.md
          sha256sum dist-release/jev-gate-codex-*.zip >> dist-release/NOTES.md
      # main may have moved while the job ran: fetch it again and repeat the comparison just before publishing.
      - run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          node scripts/release.mjs check --tag "$GITHUB_REF_NAME" --against origin/main
      # A rerun after a later step failed finds the release already published: verify it below instead of creating it.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME exists; verifying its assets"
          else
            gh release create "$GITHUB_REF_NAME" dist-release/*.zip \
              --verify-tag --title "$GITHUB_REF_NAME" --notes-file dist-release/NOTES.md
          fi
      # A merge between that check and the upload could still leave main serving this version with another archive or
      # other plugin files. Read back what was published and compare it, and main as it is now, with this tree. On a
      # mismatch the job fails and the release stays, rather than being withdrawn: main may already serve a later
      # version, and deleting would break installs of this one. A maintainer raises the version.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern '*.zip' --dir published --clobber
      - run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          assets=(); for f in published/*.zip; do
            case "$f" in published/jev-gate-codex-*) continue ;; esac
            assets+=(--asset "$f")
          done
          node scripts/release.mjs check --tag "$GITHUB_REF_NAME" --against origin/main "${assets[@]}"
          cmp dist-release/jev-gate-codex-*.zip published/jev-gate-codex-*.zip
