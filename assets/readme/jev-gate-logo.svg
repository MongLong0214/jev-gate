<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="jg-t jg-d">
  <title id="jg-t">Jev Gate</title>
  <desc id="jg-d">Many incoming requests converge on a glowing gate, which sends each turn to the model and effort it needs: Opus, Sonnet or Haiku.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060814"/><stop offset=".55" stop-color="#0A0F2C"/><stop offset="1" stop-color="#071A2E"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A5B4FC"/><stop offset=".5" stop-color="#818CF8"/><stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818CF8"/><stop offset=".5" stop-color="#6366F1"/><stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="in" gradientUnits="userSpaceOnUse" x1="640" y1="0" x2="830" y2="0">
      <stop offset="0" stop-color="#C7D2FE" stop-opacity="0"/><stop offset="1" stop-color="#C7D2FE" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="lane" gradientUnits="userSpaceOnUse" x1="914" y1="0" x2="1010" y2="0">
      <stop offset="0" stop-color="#A5B4FC"/><stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#6366F1" stop-opacity=".75"/><stop offset=".45" stop-color="#6366F1" stop-opacity=".22"/><stop offset="1" stop-color="#6366F1" stop-opacity="0"/></radialGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#FFFFFF" opacity=".09"/></pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".15"/><stop offset="1" stop-color="#fff"/></linearGradient>
    <mask id="dotmask"><rect width="1200" height="420" fill="url(#fade)"/></mask>
    <clipPath id="card"><rect width="1200" height="420" rx="28"/></clipPath>
    <path id="i1" d="M640 96 C 740 96, 760 210, 828 210"/>
    <path id="i2" d="M640 153 C 730 153, 770 210, 828 210"/>
    <path id="i3" d="M640 210 H 828"/>
    <path id="i4" d="M640 267 C 730 267, 770 210, 828 210"/>
    <path id="i5" d="M640 324 C 740 324, 760 210, 828 210"/>
    <path id="o1" d="M914 210 C 962 210, 958 130, 1010 130"/>
    <path id="o2" d="M914 210 H 1010"/>
    <path id="o3" d="M914 210 C 962 210, 958 290, 1010 290"/>
  </defs>
  <style>
    .t { font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    @keyframes drift { 0%,100% { transform: translate(0,0) } 50% { transform: translate(-40px,26px) } }
    @keyframes drift2 { 0%,100% { transform: translate(0,0) } 50% { transform: translate(36px,-22px) } }
    @keyframes pick { 0%,30% { opacity: 1 } 36%,94% { opacity: .1 } 100% { opacity: 1 } }
    @keyframes pill { 0%,30% { opacity: 1 } 36%,94% { opacity: 0 } 100% { opacity: 1 } }
    @keyframes ring { 0% { transform: scale(1); opacity: .55 } 100% { transform: scale(1.7); opacity: 0 } }
    .a1 { animation: drift 14s ease-in-out infinite; }
    .a2 { animation: drift2 17s ease-in-out infinite; }
    .l1, .p1 { animation: pick 6s linear infinite; }
    .l2, .p2 { animation: pick 6s linear -4s infinite; }
    .l3, .p3 { animation: pick 6s linear -2s infinite; }
    .p1, .p2, .p3 { animation-name: pill; }
    .ring { transform-origin: 870px 210px; animation: ring 3s ease-out infinite; }
    .ring2 { animation-delay: -1.5s; }
    @media (prefers-reduced-motion: reduce) {
      .a1, .a2, .ring, .l1, .l2, .l3, .p1, .p2, .p3 { animation: none; }
      .l2, .l3, .p2, .p3, .ring, .dot { opacity: 0; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <g filter="url(#blur)">
      <circle class="a1" cx="960" cy="110" r="190" fill="#6366F1" opacity=".55"/>
      <circle class="a2" cx="1130" cy="370" r="170" fill="#06B6D4" opacity=".4"/>
      <circle class="a2" cx="230" cy="430" r="230" fill="#D946EF" opacity=".2"/>
      <circle class="a1" cx="110" cy="-40" r="160" fill="#4F46E5" opacity=".3"/>
    </g>
    <rect width="1200" height="420" fill="url(#dots)" mask="url(#dotmask)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="419" rx="27.5" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>

  <!-- copy -->
  <g class="t">
    <rect x="72" y="64" width="268" height="32" rx="16" fill="#6366F1" fill-opacity=".16" stroke="#818CF8" stroke-opacity=".45"/>
    <circle cx="92" cy="80" r="4" fill="#22D3EE"/>
    <text x="106" y="85" font-size="12.5" font-weight="600" letter-spacing="2.2" fill="#C7D2FE">CLAUDE CODE · CODEX PLUGIN</text>
    <text x="68" y="190" font-size="94" font-weight="800" letter-spacing="-3.5" fill="#FFFFFF">Jev <tspan fill="url(#word)">Gate</tspan></text>
    <text x="72" y="240" font-size="26" font-weight="500" fill="#E2E8F0">The right model and effort for every turn.</text>
    <text x="72" y="274" font-size="17" fill="#94A3B8">Routing, delegation and compaction, judged by Jev, enforced by code.</text>
    <g font-size="14" font-weight="500" fill="#E2E8F0" text-anchor="middle">
      <rect x="72" y="306" width="74" height="34" rx="17" fill="#FFFFFF" fill-opacity=".06" stroke="#FFFFFF" stroke-opacity=".16"/><text x="109" y="328">Gate</text>
      <rect x="156" y="306" width="88" height="34" rx="17" fill="#FFFFFF" fill-opacity=".06" stroke="#FFFFFF" stroke-opacity=".16"/><text x="200" y="328">Router</text>
      <rect x="254" y="306" width="102" height="34" rx="17" fill="#FFFFFF" fill-opacity=".06" stroke="#FFFFFF" stroke-opacity=".16"/><text x="305" y="328">Compact</text>
      <rect x="366" y="306" width="106" height="34" rx="17" fill="#FFFFFF" fill-opacity=".06" stroke="#FFFFFF" stroke-opacity=".16"/><text x="419" y="328">Evidence</text>
      <rect x="482" y="306" width="124" height="34" rx="17" fill="#FFFFFF" fill-opacity=".06" stroke="#FFFFFF" stroke-opacity=".16"/><text x="544" y="328">Live dashboard</text>
    </g>
  </g>

  <!-- incoming requests -->
  <g fill="none" stroke="url(#in)" stroke-width="2" stroke-linecap="round">
    <use href="#i1"/><use href="#i2"/><use href="#i3"/><use href="#i4"/><use href="#i5"/>
  </g>
  <g class="dot" fill="#E0E7FF">
    <circle r="3"><animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#i1"/></animateMotion></circle>
    <circle r="3"><animateMotion dur="2.2s" begin="-.7s" repeatCount="indefinite"><mpath href="#i2"/></animateMotion></circle>
    <circle r="3"><animateMotion dur="2s" begin="-1.1s" repeatCount="indefinite"><mpath href="#i3"/></animateMotion></circle>
    <circle r="3"><animateMotion dur="2.3s" begin="-.3s" repeatCount="indefinite"><mpath href="#i4"/></animateMotion></circle>
    <circle r="3"><animateMotion dur="2.7s" begin="-1.6s" repeatCount="indefinite"><mpath href="#i5"/></animateMotion></circle>
  </g>

  <!-- lanes to models -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity=".14" stroke-width="3" stroke-linecap="round">
    <use href="#o1"/><use href="#o2"/><use href="#o3"/>
  </g>
  <g fill="none" stroke="url(#lane)" stroke-width="4" stroke-linecap="round" filter="url(#glow)">
    <use class="l1" href="#o1"/><use class="l2" href="#o2"/><use class="l3" href="#o3"/>
  </g>

  <!-- gate -->
  <circle cx="870" cy="210" r="120" fill="url(#halo)"/>
  <circle class="ring" cx="870" cy="210" r="46" fill="none" stroke="#818CF8" stroke-width="2"/>
  <circle class="ring ring2" cx="870" cy="210" r="46" fill="none" stroke="#22D3EE" stroke-width="2"/>
  <rect x="826" y="166" width="88" height="88" rx="24" fill="url(#gate)" filter="url(#glow)"/>
  <rect x="826.5" y="166.5" width="87" height="87" rx="23.5" fill="none" stroke="#FFFFFF" stroke-opacity=".35"/>
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
    <path d="M842 210 H 856" stroke-width="5"/>
    <circle cx="864" cy="210" r="7.5" stroke-width="4.5"/>
    <path d="M872 210 C 880 210, 880 192, 892 192" stroke-width="4" opacity=".45"/>
    <path d="M872 210 C 880 210, 880 228, 892 228" stroke-width="4" opacity=".45"/>
    <path d="M872 210 H 894" stroke-width="5"/>
  </g>
  <circle cx="896" cy="210" r="5" fill="#FFFFFF"/>

  <!-- models -->
  <g class="t" font-size="16" font-weight="600">
    <rect x="1010" y="108" width="142" height="44" rx="22" fill="#0B1024" stroke="#FFFFFF" stroke-opacity=".16"/>
    <rect class="p1" x="1010" y="108" width="142" height="44" rx="22" fill="#6366F1" fill-opacity=".22" stroke="#22D3EE" stroke-width="1.5"/>
    <text x="1032" y="135" fill="#F8FAFC">Opus <tspan class="mono" font-size="12" font-weight="500" fill="#93C5FD" dx="6">xhigh</tspan></text>
    <rect x="1010" y="188" width="142" height="44" rx="22" fill="#0B1024" stroke="#FFFFFF" stroke-opacity=".16"/>
    <rect class="p2" x="1010" y="188" width="142" height="44" rx="22" fill="#6366F1" fill-opacity=".22" stroke="#22D3EE" stroke-width="1.5"/>
    <text x="1032" y="215" fill="#F8FAFC">Sonnet <tspan class="mono" font-size="12" font-weight="500" fill="#93C5FD" dx="6">high</tspan></text>
    <rect x="1010" y="268" width="142" height="44" rx="22" fill="#0B1024" stroke="#FFFFFF" stroke-opacity=".16"/>
    <rect class="p3" x="1010" y="268" width="142" height="44" rx="22" fill="#6366F1" fill-opacity=".22" stroke="#22D3EE" stroke-width="1.5"/>
    <text x="1032" y="295" fill="#F8FAFC">Haiku <tspan class="mono" font-size="12" font-weight="500" fill="#93C5FD" dx="6">low</tspan></text>
  </g>
</svg>
