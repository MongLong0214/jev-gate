<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400"
     role="img" aria-labelledby="jg-pilot-title jg-pilot-desc">
  <title id="jg-pilot-title">V3 pilot: plain Sonnet was still the better observed option</title>
  <desc id="jg-pilot-desc">Estimated cost per run across four configurations on four fixtures, one run, seed 42, September 17 2026. Always-Fable on the original request cost 2.39 dollars and passed 3 of 4. Always-Fable on the Jev-enriched request cost 2.50 dollars and passed 3 of 4. Plain Sonnet with the plugin absent cost 0.58 dollars and passed 4 of 4. Sonnet behind the V3 Jev gate cost 1.42 dollars and passed 4 of 4. The gate beat always-Fable but cost about 2.46 times more than plain Sonnet for the same four passes.</desc>

  <style>
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .title { font-size: 20px; font-weight: 700; fill: #F0F6FC; }
    .sub   { font-size: 15px; font-weight: 600; fill: #8B949E; }
    .row   { font-size: 17px; font-weight: 600; fill: #C9D1D9; }
    .val   { font-size: 17px; font-weight: 700; fill: #F0F6FC; }
    .pass  { font-size: 15px; font-weight: 700; }
    .foot  { font-size: 17px; font-weight: 600; fill: #C9D1D9; }
  </style>

  <rect width="760" height="400" fill="#0D1117"/>

  <text class="sans title" x="28" y="42">Estimated cost for the same four fixtures</text>
  <text class="sans sub"   x="28" y="66">V3 pilot · 4 fixtures · 1 run · seed 42 · 2026-09-17 · exploratory, not a production benchmark</text>

  <!-- Fable, original request: 2.3940 -->
  <text class="sans row" x="28" y="116">Fable, original request</text>
  <rect x="270" y="98" width="365" height="26" rx="4" fill="#A371F7" opacity=".75"/>
  <text class="mono val"  x="645" y="118">$2.39</text>
  <text class="mono pass" x="645" y="118" dx="58" fill="#8B949E">3/4</text>

  <!-- Fable, Jev-enriched: 2.4951 -->
  <text class="sans row" x="28" y="166">Fable, Jev-enriched</text>
  <rect x="270" y="148" width="380" height="26" rx="4" fill="#A371F7" opacity=".75"/>
  <text class="mono val"  x="660" y="168">$2.50</text>
  <text class="mono pass" x="660" y="168" dx="58" fill="#8B949E">3/4</text>

  <!-- Sonnet, plugin absent: 0.5781 -->
  <text class="sans row" x="28" y="216" fill="#F0F6FC">Sonnet, plugin absent</text>
  <rect x="270" y="198" width="88" height="26" rx="4" fill="#3FB950"/>
  <text class="mono val"  x="368" y="218">$0.58</text>
  <text class="mono pass" x="368" y="218" dx="58" fill="#3FB950">4/4</text>

  <!-- Sonnet, V3 Jev gate: 1.4242 -->
  <text class="sans row" x="28" y="266">Sonnet, V3 Jev gate</text>
  <rect x="270" y="248" width="217" height="26" rx="4" fill="#58A6FF" opacity=".85"/>
  <text class="mono val"  x="497" y="268">$1.42</text>
  <text class="mono pass" x="497" y="268" dx="58" fill="#3FB950">4/4</text>

  <path d="M28 310 H732" stroke="#21262D" stroke-width="2"/>
  <text class="sans foot" x="28" y="344">The gate beat always-Fable. It still lost to plain Sonnet:</text>
  <text class="sans foot" x="28" y="370" fill="#F85149">2.46&#215; the cost and 1.87&#215; the time for the same four passes.</text>
</svg>
